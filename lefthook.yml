pre-commit:
  commands:
    lint:
      glob: "**/*.{ts,tsx,js,jsx,json}"
      run: bunx biome check --fix --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
    types:
      run: bun run check:types
      skip:
        - merge
        - rebase
    tests:
      run: bun test
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
